name: Bokashi
options:
  bundleIdPrefix: com.snaka
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  BokashiCore:
    path: Packages/BokashiCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Bokashi:
    type: application
    platform: macOS
    sources:
      - path: Bokashi
    dependencies:
      - package: BokashiCore
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: Bokashi/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Bokashi
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright © 2026 snaka. MIT License."
        SUFeedURL: https://snaka.github.io/Bokashi/appcast.xml
        # Generated by Sparkle's `generate_keys`; the matching private key
        # lives in the SPARKLE_ED_PRIVATE_KEY repo secret. See RELEASE.md
        # for the one-time setup.
        SUPublicEDKey: l1QQwq5QWJjOR6kG5iP//6vDgKLnAGmjbw2Hwk7dZM4=
        # Default value used until the user flips the Settings toggle
        # (Settings → General → "Check for updates automatically").
        # Sparkle then persists their choice in UserDefaults and ignores
        # this Info.plist value on subsequent launches.
        SUEnableAutomaticChecks: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaka.Bokashi
        PRODUCT_NAME: Bokashi
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: Z9MLDKXDEQ
        CODE_SIGN_IDENTITY: 6070D8E483D0D6268727E48298FF9B4612B08A23
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: Bokashi/Bokashi.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
