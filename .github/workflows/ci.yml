name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Bokashi.xcodeproj \
            -scheme Bokashi \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  test-core:
    name: Test BokashiCore
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run BokashiCore tests
        run: swift test --package-path Packages/BokashiCore
